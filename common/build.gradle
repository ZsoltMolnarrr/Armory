architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }

    mavenLocal()
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // No Fabric API in common: there is no Forgified Fabric API on the 1.20.1 line, so loader API
    // usage stays in the platform modules (fabric/ and forge/).

    modImplementation("dev.kosmx.player-anim:player-animation-lib-${platform}:${rootProject.player_anim_version}")
    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")

    // Ecosystem libraries: all resolved from the Modrinth maven.
    modImplementation("maven.modrinth:armor-model-api:${rootProject.armor_model_api_version}-${platform}")
    modImplementation("maven.modrinth:tiny-config:${rootProject.tiny_config_version}-${platform}")
    modImplementation("maven.modrinth:spell-power:${rootProject.spell_power_version}-${platform}")
    modImplementation("maven.modrinth:spell-engine:${rootProject.spell_engine_version}-${platform}") { transitive = false }

    // RangedWeaponAPI is NOT on the compile classpath: there is no two-platform 1.20.1 artifact yet.
    // The `ranged_weapon:damage` / `ranged_weapon:haste` set bonuses are resolved by registry id at
    // registration time and skipped when RWA is absent (see ArmorSets / SetBonuses).
}
